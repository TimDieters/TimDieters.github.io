name: Vissen ophalen

on:
  schedule:
    - cron: "17 5 * * *"   # elke dag rond 06:17 (winter) / 07:17 (zomer) Nederlandse tijd
  workflow_dispatch:        # ook handmatig te starten via de knop "Run workflow"

permissions:
  contents: write

concurrency: vissen-ophalen

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Amsterdam
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # geheime naam van je meldingenkanaal; leeg = geen meldingen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vissen ophalen en pagina bouwen
        run: python scrape.py
      - name: Wijzigingen vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vissen_raw.json
          git diff --cached --quiet || git commit -m "Vissen bijgewerkt $(date +%F)"
          git push
